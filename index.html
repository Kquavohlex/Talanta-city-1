
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalantaTix Kenya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #062c19, #087a3c);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      color: #222;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px #0005;
    }
    .brand {
      text-align: center;
      color: #087a3c;
      font-size: 27px;
      font-weight: bold;
    }
    .tag {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tabs button {
      flex: 1;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }
    .tabs button.active { background: #087a3c; color: white; }
    h2 { text-align: center; }
    label { display: block; font-weight: bold; margin: 12px 0 6px; }
    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }
    .submit {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #087a3c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .submit:disabled { opacity: .6; }
    .message {
      padding: 10px;
      border-radius: 7px;
      margin: 12px 0;
      display: none;
    }
    .success { background: #e2f7e9; color: #12632c; }
    .error { background: #ffe5e5; color: #a40000; }
    .small { text-align: center; color: #777; font-size: 12px; margin-top: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">🇰🇪 TalantaTix Kenya</div>
    <p class="tag">Your Ticket. Your Stadium. Your Moment.</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="registerTab" type="button">Create Account</button>
    </div>

    <div id="message" class="message" role="status"></div>

    <form id="loginForm">
      <h2>Welcome Back</h2>
      <label>Email Address</label>
      <input type="email" name="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>

      <button class="submit" type="submit">Login</button>
    </form>

    <form id="registerForm" hidden>
      <h2>Create Your Account</h2>

      <label>Full Name</label>
      <input name="name" type="text" placeholder="Your full name" required minlength="2">

      <label>Phone Number</label>
      <input name="phone" type="tel" placeholder="+2547XXXXXXXX" required>

      <label>Email Address</label>
      <input name="email" type="email" placeholder="Your email address" required>

      <label>Country</label>
      <select name="country" required>
        <option value="">Select country</option>
        <option>Kenya</option>
        <option>Uganda</option>
        <option>Tanzania</option>
        <option>Rwanda</option>
        <option>Burundi</option>
        <option>South Sudan</option>
        <option>Ethiopia</option>
        <option>Somalia</option>
        <option>Nigeria</option>
        <option>Ghana</option>
        <option>South Africa</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Other</option>
      </select>

      <label>Password</label>
      <input name="password" type="password" minlength="8" placeholder="At least 8 characters" required>

      <label>Confirm Password</label>
      <input name="confirmPassword" type="password" minlength="8" placeholder="Confirm your password" required>

      <button class="submit" type="submit">Create Account</button>
    </form>

    <p class="small">Secure account access · TalantaTix Kenya</p>
  </div>

  <script>
    const API_URL = "/api";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
      message.style.display = "block";
    }

    function switchTab(mode) {
      const registering = mode === "register";
      loginForm.hidden = registering;
      registerForm.hidden = !registering;
      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);
      message.style.display = "none";
    }

    loginTab.addEventListener("click", () => switchTab("login"));
    registerTab.addEventListener("click", () => switchTab("register"));

    async function sendRequest(endpoint, data) {
      const response = await fetch(API_URL + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(data)
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(result.message || result.error || "Request failed.");
      }

      return result;
    }

    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(registerForm).entries());

      if (data.password !== data.confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      const button = registerForm.querySelector("button");
      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        await sendRequest("/auth/register", data);
        showMessage("Account created successfully. You can now log in.", "success");
        registerForm.reset();
        switchTab("login");
        showMessage("Account created successfully. Please log in.", "success");
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(loginForm).entries());
      const button = loginForm.querySelector("button");

      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const result = await sendRequest("/auth/login", data);
        showMessage("Login successful!", "success");

        if (result.token) {
          localStorage.setItem("talantatix_token", result.token);
        }

        if (result.user) {
          localStorage.setItem("talantatix_user", JSON.stringify(result.user));
        }
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>
</body>
</html>
